<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Modal Test Page</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #eef2ee;
        color: #1f2421;
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }

      img {
        width: 100%;
        border: 1px solid #c7d0c8;
        border-radius: 8px;
        background: white;
      }
    </style>
  </head>
  <body>
    <h1>Alt-click an image</h1>
    <main>

</html>
