<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modal Test Page</title>
    <link rel="stylesheet" href="modal.css">
    <link rel="stylesheet" href="table.css">
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        padding: 28px clamp(16px, 4vw, 48px) 80px;
        background: #f1f4f9;
        color: #1b2233;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      h1 { font-size: 24px; margin: 0 0 4px; }
      h2 { font-size: 18px; margin: 40px 0 6px; }
      .hint {
        color: #4a5675;
        font-size: 14px;
        margin: 0 0 8px;
      }
      .badge {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #e2e8ff;
        color: #2236b0;
        font-size: 12px;
        font-weight: 700;
        vertical-align: middle;
      }
      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px;
        margin-top: 10px;
      }
      .image-grid figure {
        margin: 0;
        background: #fff;
        border: 1px solid #d6dcea;
        border-radius: 10px;
        overflow: hidden;
      }
      .image-grid img {
        display: block;
        width: 100%;
        height: 150px;
        object-fit: cover;
        background: #e9edf6;
      }
      .image-grid figcaption {
        padding: 6px 10px;
        font-size: 12px;
        color: #4a5675;
      }

      table.demo {
        border-collapse: collapse;
        background: #fff;
        font-size: 13px;
        box-shadow: 0 1px 2px rgba(20, 28, 50, 0.08);
        max-width: 100%;
      }
      table.demo th, table.demo td {
        border: 1px solid #d8deea;
        padding: 6px 12px;
        text-align: left;
        vertical-align: top;
      }
      table.demo th { background: #e7ecf7; position: sticky; top: 0; }
      table.demo td.num { text-align: right; font-variant-numeric: tabular-nums; }

      .scroll-box {
        max-height: 320px;
        overflow: auto;
        border: 1px solid #d8deea;
        border-radius: 8px;
      }

      .grid-table {
        display: grid;
        background: #fff;
        border: 1px solid #d8deea;
        border-radius: 8px;
        overflow: hidden;
        max-width: 760px;
      }
      .grid-table > div {
        padding: 7px 12px;
        border-bottom: 1px solid #eef1f8;
        border-right: 1px solid #eef1f8;
        font-size: 13px;
      }
      .grid-table > div.gh {
        background: #e7ecf7;
        font-weight: 700;
      }

      .railway-dialog {
        width: min(760px, 100%);
        background: #fff;
        border: 1px solid #d8deea;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(20, 28, 50, 0.12);
        padding: 24px;
      }
      .railway-dialog h3 {
        margin: 0 0 18px;
        font-size: 20px;
      }
      .railway-dns-wrap {
        border: 1px solid #d8deea;
        border-radius: 8px;
        overflow: hidden;
      }
      .railway-dns-grid {
        display: grid;
        grid-template-columns: auto minmax(12rem, 14rem) minmax(0, 1fr);
        font-size: 13px;
      }
      .railway-dns-grid > div {
        min-width: 0;
        padding: 10px 14px;
        border-top: 1px solid #e9edf5;
      }
      .railway-dns-grid > div:nth-child(-n + 3) {
        border-top: 0;
        background: #f7f9fc;
        color: #5b6680;
        font-size: 12px;
      }
      .railway-cell-inner {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .railway-copy-cell {
        cursor: pointer;
        user-select: none;
      }
      .railway-copy-cell .railway-cell-inner {
        justify-content: space-between;
      }
      .railway-copy-cell span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .railway-icon {
        color: #15a46b;
        flex: none;
      }
      .railway-copy-icon {
        color: #8b95aa;
        flex: none;
      }
    </style>
  </head>
  <body>
    <h1>Extension Modal Test Page</h1>
    <p class="hint">Alt-click any image to open the image modal. Alt-click any table or grid below to open the table viewer.</p>
    <div id="root"></div>
    <!-- Generate the page content first, then load the modal scripts so their
         Alt-click / keyboard handlers attach to the finished DOM. These are the
         same IIFE scripts used as content scripts; on our own extension page
         they run same-origin (allowed by CSP) and chrome.runtime is available. -->
    <script src="test-page.js"></script>
    <script src="table.js"></script>
    <script src="content.js"></script>
  </body>
</html>
